<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorador de Activos SAP | Taxonomía</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #334155;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ut-color: #f59e0b;
      --eq-color: #10b981;
      --subeq-color: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Barra superior */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-right: 10px; }
    
    .search-box {
      flex: 1;
      min-width: 240px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }

    select, button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: var(--panel-hover); }
    button.primary { background: var(--accent); color: #0f172a; font-weight: 600; border: none; }

    /* Contenedor principal dividido */
    main { display: flex; flex: 1; overflow: hidden; }

    /* Panel Izquierdo: Árbol */
    #tree-container {
      width: 55%;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 15px;
    }

    .node { margin-left: 18px; border-left: 1px dashed #334155; padding-left: 8px; }
    .node-root { margin-left: 0; border-left: none; padding-left: 0; }
    
    .node-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.88rem;
      user-select: none;
    }
    .node-row:hover { background: var(--panel-hover); }
    .node-row.selected { background: rgba(56, 189, 248, 0.18); border: 1px solid rgba(56, 189, 248, 0.4); }

    .toggle { width: 16px; text-align: center; color: var(--muted); font-size: 0.75rem; }
    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-ut { background: rgba(245, 158, 11, 0.15); color: var(--ut-color); }
    .badge-eq { background: rgba(16, 185, 129, 0.15); color: var(--eq-color); }
    .badge-sub { background: rgba(168, 85, 247, 0.15); color: var(--subeq-color); }

    .code { font-family: monospace; font-weight: 600; color: #e2e8f0; }
    .desc { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .children { display: none; }
    .children.open { display: block; }

    /* Panel Derecho: Ficha Técnica */
    #detail-container {
      width: 45%;
      overflow-y: auto;
      padding: 24px;
      background: rgba(30, 41, 59, 0.4);
    }

    .empty-state { color: var(--muted); text-align: center; margin-top: 25%; font-size: 0.95rem; }
    
    .detail-header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .detail-title { font-size: 1.25rem; margin: 8px 0 4px; }
    .detail-code { font-family: monospace; color: var(--accent); font-size: 1rem; display: flex; align-items: center; gap: 10px; }
    
    .grid-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .spec-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
    }
    .spec-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .spec-value { font-size: 0.9rem; font-weight: 500; word-break: break-word; }

    /* Espacio reservado para expansión futura */
    .future-actions {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loader { padding: 20px; color: var(--accent); font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Taxonomía SAP</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Buscar por Tag, Equipo SAP, Ubicación o descripción..." />
    <select id="filterTroncal"><option value="">Todas las Troncales</option></select>
    <select id="filterCriticidad"><option value="">Toda Criticidad</option></select>
    <button onclick="expandirTodo(true)">Expandir</button>
    <button onclick="expandirTodo(false)">Contraer</button>
    <button class="primary" onclick="cargarDatos(true)">↻ Actualizar</button>
  </header>

  <main>
    <div id="tree-container">
      <div class="loader">Cargando estructura desde Google Sheets...</div>
    </div>
    <div id="detail-container">
      <div class="empty-state">Selecciona una Ubicación Técnica o Equipo en el árbol para ver su ficha técnica.</div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx_V7vCNrVFpOGeD3waVKZ7RIJkAer2Z-KLj2bxbmv5g8AgjxZeDqqqihu5NT4F_0th/exec";
    const STORAGE_KEY = "sap_tree_cache_v1";

    let rawUT = [];
    let rawEQ = [];
    let treeData = [];

    async function cargarDatos(forzarRed = false) {
      const container = document.getElementById("tree-container");

      if (!forzarRed) {
        const localData = localStorage.getItem(STORAGE_KEY);
        if (localData) {
          try {
            const json = JSON.parse(localData);
            rawUT = json.ubicaciones || [];
            rawEQ = json.equipos || [];
            inicializarVista();
            return;
          } catch (e) {}
        }
      }

      container.innerHTML = '<div class="loader">Sincronizando datos desde Google Sheets...</div>';

      try {
        const url = forzarRed ? `${API_URL}?refresh=1` : API_URL;
        const res = await fetch(url);
        const json = await res.json();
        rawUT = json.ubicaciones || [];
        rawEQ = json.equipos || [];

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(json));
        } catch (e) {}

        inicializarVista();
      } catch (err) {
        container.innerHTML = `<div class="loader" style="color:#f87171;">Error al conectar con Google Sheets. Revisa la URL del script.<br><small>${err}</small></div>`;
      }
    }

    function inicializarVista() {
      poblarFiltros();
      treeData = construirArbol(rawUT, rawEQ);
      renderizarArbol();
    }

    function poblarFiltros() {
      const troncales = new Set();
      const criticidades = new Set();

      [...rawUT, ...rawEQ].forEach(item => {
        if (item["Troncal"]) troncales.add(item["Troncal"]);
        if (item["Criticidad"]) criticidades.add(item["Criticidad"]);
      });

      const selTroncal = document.getElementById("filterTroncal");
      selTroncal.innerHTML = '<option value="">Todas las Troncales</option>';
      [...troncales].sort().forEach(t => selTroncal.innerHTML += `<option value="${t}">${t}</option>`);

      const selCrit = document.getElementById("filterCriticidad");
      selCrit.innerHTML = '<option value="">Toda Criticidad</option>';
      [...criticidades].sort().forEach(c => selCrit.innerHTML += `<option value="${c}">Criticidad: ${c}</option>`);
    }

    function construirArbol(ubicaciones, equipos) {
      const mapUT = {};
      const mapEQ = {};
      const roots = [];

      // 1. Indexar Ubicaciones Técnicas (IH06)
      ubicaciones.forEach(u => {
        const id = u["Ubicación técnica"];
        if (!id) return;
        const textoBusqueda = `${id} ${u["Denominación de la ubicación técnica"] || ""} ${Object.values(u).join(" ")}`.toLowerCase();
        mapUT[id] = {
          tipo: "UT",
          id: id,
          nombre: u["Denominación de la ubicación técnica"] || "Sin denominación",
          padreUT: u["Ubicación técnica superior"] || "",
          raw: u,
          _searchText: textoBusqueda,
          children: []
        };
      });

      // 2. Indexar Equipos (IH08)
      equipos.forEach(e => {
        const id = e["Equipo"];
        if (!id) return;
        const textoBusqueda = `${id} ${e["Denominación de objeto técnico"] || ""} ${Object.values(e).join(" ")}`.toLowerCase();
        mapEQ[id] = {
          tipo: e["Equipo superior"] ? "SUBEQ" : "EQ",
          id: id,
          nombre: e["Denominación de objeto técnico"] || "Sin denominación",
          padreUT: e["Ubicación técnica"] || "",
          padreEQ: e["Equipo superior"] || "",
          raw: e,
          _searchText: textoBusqueda,
          children: []
        };
      });

      // 3. Jerarquía entre Ubicaciones Técnicas
      Object.values(mapUT).forEach(ut => {
        if (ut.padreUT && mapUT[ut.padreUT]) {
          mapUT[ut.padreUT].children.push(ut);
        } else {
          roots.push(ut);
        }
      });

      // 4. Colgar Equipos y Sub-equipos
      Object.values(mapEQ).forEach(eq => {
        if (eq.padreEQ && mapEQ[eq.padreEQ]) {
          mapEQ[eq.padreEQ].children.push(eq);
        } else if (eq.padreUT && mapUT[eq.padreUT]) {
          mapUT[eq.padreUT].children.push(eq);
        } else {
          roots.push(eq);
        }
      });

      return roots;
    }

    function renderizarArbol() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const troncal = document.getElementById("filterTroncal").value;
      const crit = document.getElementById("filterCriticidad").value;

      const hayFiltro = query.length > 0 || troncal !== "" || crit !== "";
      const arbolFiltrado = hayFiltro ? filtrarNodos(treeData, query, troncal, crit) : treeData;

      const container = document.getElementById("tree-container");
      container.innerHTML = "";

      if (arbolFiltrado.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron activos con esos criterios.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      arbolFiltrado.forEach(root => {
        fragment.appendChild(crearElementoNodo(root, true, hayFiltro));
      });
      container.appendChild(fragment);
    }

    function filtrarNodos(nodos, query, troncal, crit, ancestroCoincidio = false) {
      return nodos.map(nodo => {
        const matchQuery = !query || nodo._searchText.includes(query);
        const matchTroncal = !troncal || nodo.raw["Troncal"] === troncal;
        const matchCrit = !crit || nodo.raw["Criticidad"] === crit;

        const esteNodoCoincide = matchQuery && matchTroncal && matchCrit;
        const mostrarHijosCompletos = ancestroCoincidio || (Boolean(query) && esteNodoCoincide);

        const hijosFiltrados = mostrarHijosCompletos
          ? filtrarNodos(nodo.children, "", troncal, crit, true)
          : filtrarNodos(nodo.children, query, troncal, crit, false);

        if (esteNodoCoincide || hijosFiltrados.length > 0) {
          return {
            ...nodo,
            children: hijosFiltrados,
            _expandirPorFiltro: !ancestroCoincidio && hijosFiltrados.length > 0
          };
        }
        return null;
      }).filter(Boolean);
    }

    function crearElementoNodo(nodo, isRoot, hayFiltro) {
      const div = document.createElement("div");
      div.className = isRoot ? "node node-root" : "node";

      const tieneHijos = nodo.children && nodo.children.length > 0;
      const abrirHijos = hayFiltro && (nodo._expandirPorFiltro !== false);

      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const badgeText = nodo.tipo === "UT" ? "UT" : (nodo.tipo === "EQ" ? "EQ" : "SUB");

      const row = document.createElement("div");
      row.className = "node-row";
      row.innerHTML = `
        <span class="toggle">${tieneHijos ? (abrirHijos ? "▼" : "▶") : "•"}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="code">${nodo.id}</span>
        <span class="desc" title="${nodo.nombre}">${nodo.nombre}</span>
      `;

      row.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll(".node-row.selected").forEach(el => el.classList.remove("selected"));
        row.classList.add("selected");
        mostrarDetalle(nodo);

        if (tieneHijos) {
          const childrenDiv = div.querySelector(".children");
          const toggleSpan = row.querySelector(".toggle");
          const isOpen = childrenDiv.classList.toggle("open");
          toggleSpan.textContent = isOpen ? "▼" : "▶";
        }
      };

      div.appendChild(row);

      if (tieneHijos) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = abrirHijos ? "children open" : "children";
        nodo.children.forEach(hijo => {
          childrenContainer.appendChild(crearElementoNodo(hijo, false, hayFiltro));
        });
        div.appendChild(childrenContainer);
      }

      return div;
    }

    function mostrarDetalle(nodo) {
      const panel = document.getElementById("detail-container");
      const r = nodo.raw;
      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const tipoLabel = nodo.tipo === "UT" ? "Ubicación Técnica (IH06)" : (nodo.tipo === "EQ" ? "Equipo Principal (IH08)" : "Sub-equipo / Componente (IH08)");

      let specsHTML = "";
      Object.entries(r).forEach(([clave, valor]) => {
        if (valor && valor.trim() !== "") {
          specsHTML += `
            <div class="spec-card">
              <div class="spec-label">${clave}</div>
              <div class="spec-value">${valor}</div>
            </div>
          `;
        }
      });

      panel.innerHTML = `
        <div class="detail-header">
          <span class="badge ${badgeClass}">${tipoLabel}</span>
          <h2 class="detail-title">${nodo.nombre}</h2>
          <div class="detail-code">
            <span>${nodo.id}</span>
            <button onclick="navigator.clipboard.writeText('${nodo.id}')" title="Copiar código">📋 Copiar</button>
          </div>
        </div>
        <div class="grid-specs">${specsHTML}</div>
        <div class="future-actions">
          <button onclick="alert('Aquí conectaremos el historial de inspecciones de ${nodo.id}')">🔍 Ver Inspecciones (Próximamente)</button>
          <button onclick="alert('Aquí abriremos planos/documentos de ${nodo.id}')">📁 Documentos Asociados</button>
        </div>
      `;
    }

    function expandirTodo(abrir) {
      document.querySelectorAll(".children").forEach(el => {
        abrir ? el.classList.add("open") : el.classList.remove("open");
      });
      document.querySelectorAll(".node-row").forEach(row => {
        const toggle = row.querySelector(".toggle");
        if (toggle.textContent !== "•") toggle.textContent = abrir ? "▼" : "▶";
      });
    }

    // Eventos en tiempo real con debounce
    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderizarArbol, 200);
    });
    document.getElementById("filterTroncal").addEventListener("change", renderizarArbol);
    document.getElementById("filterCriticidad").addEventListener("change", renderizarArbol);

    // Iniciar
    cargarDatos();
  </script>
</body>
</html>
