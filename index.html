<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explorador de Activos SAP | Taxonomía</title>
  <meta name="theme-color" content="#050914" />

  <style>
    :root {
      --bg: #050914;
      --panel: rgba(11, 20, 38, 0.9);
      --panel-hover: rgba(18, 36, 66, 0.96);
      --border: rgba(0, 229, 255, 0.28);
      --text: #e6f1ff;
      --muted: #7f9bb8;
      --accent: #00e5ff;
      --ut-color: #ffb800;
      --eq-color: #00f5a0;
      --subeq-color: #c084fc;
      --create-color: #ff2a85;
      --ok-bg: rgba(0, 245, 160, 0.12);
      --err-bg: rgba(255, 59, 92, 0.14);
      --glow: 0 0 14px rgba(0, 229, 255, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(0, 229, 255, 0.08), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.08), transparent 45%),
        linear-gradient(rgba(0, 229, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.mobile-detail-active header { display: none; }

    /* Barra superior HUD */
    header {
      background: linear-gradient(180deg, rgba(10, 19, 36, 0.97), rgba(7, 13, 25, 0.93));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    header h1 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 245, 160, 0.12);
      color: var(--eq-color);
      border: 1px solid rgba(0, 245, 160, 0.35);
      box-shadow: 0 0 10px rgba(0, 245, 160, 0.15);
    }
    .status-pill.offline {
      background: rgba(255, 184, 0, 0.14);
      color: var(--ut-color);
      border-color: rgba(255, 184, 0, 0.4);
      box-shadow: none;
    }

    .search-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .search-box {
      flex: 1;
      min-width: 180px;
      background: rgba(5, 11, 22, 0.88);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .toggle-filters-btn { display: none; }

    .controls-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button {
      background: rgba(7, 15, 30, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    button:hover, select:hover {
      background: var(--panel-hover);
      border-color: rgba(0, 229, 255, 0.55);
    }

    .hud-btn-cut {
      clip-path: polygon(
        8px 0%,
        100% 0%,
        100% calc(100% - 8px),
        calc(100% - 8px) 100%,
        0% 100%,
        0% 8px
      );
    }

    .hud-frame {
      position: relative;
      background: linear-gradient(145deg, rgba(12, 24, 46, 0.95), rgba(6, 12, 24, 0.97));
      border: 1px solid rgba(0, 229, 255, 0.42);
      clip-path: polygon(
        14px 0%,
        calc(100% - 14px) 0%,
        100% 14px,
        100% calc(100% - 14px),
        calc(100% - 14px) 100%,
        14px 100%,
        0% calc(100% - 14px),
        0% 14px
      );
      box-shadow: inset 0 0 18px rgba(0, 229, 255, 0.12);
    }

    button.primary {
      background: linear-gradient(135deg, #00e5ff, #0284c7);
      color: #03101d;
      font-weight: 800;
      border: none;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.28);
    }

    button.field-btn.active {
      background: linear-gradient(135deg, #ffb800, #f59e0b);
      color: #1c1202;
      font-weight: 800;
      border: none;
      box-shadow: 0 0 12px rgba(255, 184, 0, 0.35);
    }

    main { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* Árbol izquierdo */
    #tree-container {
      width: 52%;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 14px;
    }

    .node { margin-left: 15px; border-left: 1px dashed rgba(0, 229, 255, 0.25); padding-left: 6px; }
    .node-root { margin-left: 0; border-left: none; padding-left: 0; }

    .node-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.84rem;
      user-select: none;
      margin-bottom: 2px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .node-row:hover {
      background: var(--panel-hover);
      border-color: rgba(0, 229, 255, 0.22);
    }
    .node-row.selected {
      background: rgba(0, 229, 255, 0.14);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .toggle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 0.78rem;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .toggle:hover { background: rgba(0, 229, 255, 0.14); }

    .badge {
      font-size: 0.64rem;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-ut { background: rgba(255, 184, 0, 0.14); color: var(--ut-color); border: 1px solid rgba(255, 184, 0, 0.3); }
    .badge-eq { background: rgba(0, 245, 160, 0.14); color: var(--eq-color); border: 1px solid rgba(0, 245, 160, 0.3); }
    .badge-sub { background: rgba(192, 132, 252, 0.14); color: var(--subeq-color); border: 1px solid rgba(192, 132, 252, 0.3); }

    .code { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; color: #f0f9ff; flex-shrink: 0; }
    .desc { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .children { display: none; }
    .children.open { display: block; }

    /* Panel derecho */
    #detail-container {
      width: 48%;
      overflow-y: auto;
      padding: 18px;
      background: rgba(7, 14, 28, 0.65);
    }

    .mobile-back-btn {
      display: none;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 11px 14px;
      font-weight: 700;
      width: 100%;
      text-align: left;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: var(--glow);
    }

    .empty-state { color: var(--muted); text-align: center; margin-top: 22%; font-size: 0.92rem; padding: 0 20px; line-height: 1.5; }
    .detail-header { border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .detail-title { font-size: 1.2rem; margin: 8px 0 6px; font-weight: 700; }
    .detail-code { font-family: monospace; color: var(--accent); font-size: 0.95rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .grid-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .spec-card {
      background: var(--panel);
      border: 1px solid rgba(0, 229, 255, 0.22);
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: var(--glow);
    }
    .spec-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
    .spec-value { font-size: 0.88rem; font-weight: 600; word-break: break-word; }

    .future-actions {
      margin-top: 20px;
      padding: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loader { padding: 20px; color: var(--accent); font-size: 0.92rem; }

    /* ==========================================
       MODO CLARO / ALTO CONTRASTE PARA SOL (CAMPO)
       ========================================== */
    body.light-field {
      --bg: #eef2f6;
      --panel: #ffffff;
      --panel-hover: #e2e8f0;
      --border: #94a3b8;
      --text: #0f172a;
      --muted: #334155;
      --accent: #0369a1;
      --ut-color: #b45309;
      --eq-color: #047857;
      --subeq-color: #6d28d9;
      --create-color: #be185d;
      --ok-bg: rgba(5, 150, 105, 0.14);
      --err-bg: rgba(220, 38, 38, 0.14);
      --glow: 0 2px 10px rgba(15, 23, 42, 0.08);
      background-color: var(--bg);
      background-image: none;
      color: var(--text);
    }

    body.light-field header {
      background: #ffffff;
      backdrop-filter: none;
      border-bottom: 1.5px solid #94a3b8;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }

    body.light-field header h1 {
      color: #0369a1;
      text-shadow: none;
    }

    body.light-field .status-pill {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
      box-shadow: none;
    }
    body.light-field .status-pill.offline {
      background: #fef3c7;
      color: #92400e;
      border-color: #fcd34d;
    }

    body.light-field .search-box,
    body.light-field select,
    body.light-field button {
      background: #ffffff;
      border-color: #94a3b8;
      color: #0f172a;
    }

    body.light-field .search-box:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    body.light-field button:hover,
    body.light-field select:hover {
      background: #e2e8f0;
      border-color: #475569;
    }

    body.light-field button.primary {
      background: #0284c7;
      color: #ffffff;
      border: none;
      box-shadow: none;
    }

    body.light-field button.field-btn.active {
      background: #d97706;
      color: #ffffff;
      border: none;
      box-shadow: none;
    }

    body.light-field #tree-container {
      background: #f8fafc;
      border-right-color: #cbd5e1;
    }

    body.light-field #detail-container {
      background: #eef2f6;
    }

    body.light-field .node {
      border-left-color: #94a3b8;
    }

    body.light-field .node-row:hover {
      background: #e2e8f0;
    }

    body.light-field .node-row.selected {
      background: #e0f2fe;
      border-color: #0284c7;
      box-shadow: none;
    }

    body.light-field .code {
      color: #0f172a;
    }

    body.light-field .desc {
      color: #334155;
    }

    body.light-field .badge-ut {
      background: #fef3c7;
      color: #92400e;
      border-color: #f59e0b;
    }

    body.light-field .badge-eq {
      background: #d1fae5;
      color: #065f46;
      border-color: #10b981;
    }

    body.light-field .badge-sub {
      background: #ede9fe;
      color: #5b21b6;
      border-color: #8b5cf6;
    }

    body.light-field .spec-card {
      background: #ffffff;
      border-color: #94a3b8;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    body.light-field .hud-frame {
      background: #ffffff;
      border: 1.5px solid #0284c7;
      clip-path: none;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }

    body.light-field .hud-btn-cut {
      clip-path: none;
    }

    @media (max-width: 820px) {
      #tree-container { width: 100%; border-right: none; }
      #detail-container {
        position: absolute;
        inset: 0;
        width: 100%;
        background: var(--bg);
        z-index: 20;
        display: none;
        padding: 14px;
      }
      #detail-container.mobile-open { display: block; }
      .mobile-back-btn { display: block; }
      .grid-specs { grid-template-columns: 1fr; }
      .toggle-filters-btn { display: inline-flex; align-items: center; gap: 4px; }
      .controls-bar { display: none; }
      .controls-bar.mobile-filters-open { display: flex; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>⚙️ Taxonomía SAP</h1>
        <span id="statusPill" class="status-pill offline">SIN SINCRONIZAR</span>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="fieldModeBtn" class="field-btn hud-btn-cut" onclick="toggleModoCampo()" title="Cambiar entre Modo HUD oscuro y Modo Campo claro para sol">☀️ Modo Campo</button>
        <button class="primary hud-btn-cut" onclick="cargarDatos(true)">↻ Actualizar</button>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar por Tag, Equipo SAP, Ubicación o descripción..." />
      <input type="text" id="searchUT" class="search-box" style="max-width: 260px;" placeholder="Equipos por Ubicación Técnica..." />
      <button class="toggle-filters-btn hud-btn-cut" onclick="toggleFiltrosMovil()">Filtros</button>
    </div>

    <div id="controlsBar" class="controls-bar">
      <select id="filterEstacion"><option value="">Todas las Estaciones</option></select>
      <select id="filterTroncal"><option value="">Todas las Troncales</option></select>
      <select id="filterCriticidad"><option value="">Toda Criticidad</option></select>
      <button class="hud-btn-cut" onclick="expandirTodo(true)">Expandir</button>
      <button class="hud-btn-cut" onclick="expandirTodo(false)">Contraer</button>
    </div>
  </header>

  <main>
    <div id="tree-container">
      <div class="loader">Cargando estructura desde Google Sheets...</div>
    </div>
    <div id="detail-container">
      <button class="mobile-back-btn" onclick="cerrarDetalleMovil()">← Volver al árbol de activos</button>
      <div id="detail-content">
        <div class="empty-state">Selecciona una Ubicación Técnica o Equipo en el árbol para ver su ficha técnica.</div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx_V7vCNrVFpOGeD3waVKZ7RIJkAer2Z-KLj2bxbmv5g8AgjxZeDqqqihu5NT4F_0th/exec";
    const STORAGE_KEY = "sap_tree_cache_v1";
    const FIELD_MODE_KEY = "sap_tree_field_mode_v1";

    const ESTACIONES_MAPA = {
      "P0090": "P0090 - Estación Chimitá",
      "P0230": "P0230 - Estación Galán",
      "P0310": "P0310 - Estación Lizama",
      "P0520": "P0520 - Estación Santa Rosa",
      "P0540": "P0540 - Estación Sebastopol",
      "P0630": "P0630 - Estación Vasconia"
    };

    let rawUT = [];
    let rawEQ = [];
    let treeData = [];

    function aplicarModoCampo(activo) {
      const btn = document.getElementById("fieldModeBtn");
      const metaTheme = document.querySelector('meta[name="theme-color"]');

      if (activo) {
        document.body.classList.add("light-field");
        btn.classList.add("active");
        btn.textContent = "🌙 Modo HUD";
        if (metaTheme) metaTheme.setAttribute("content", "#eef2f6");
      } else {
        document.body.classList.remove("light-field");
        btn.classList.remove("active");
        btn.textContent = "☀️ Modo Campo";
        if (metaTheme) metaTheme.setAttribute("content", "#050914");
      }
      localStorage.setItem(FIELD_MODE_KEY, activo ? "1" : "0");
    }

    function toggleModoCampo() {
      const esActivo = document.body.classList.contains("light-field");
      aplicarModoCampo(!esActivo);
    }

    function toggleFiltrosMovil() {
      document.getElementById("controlsBar").classList.toggle("mobile-filters-open");
    }

    function abrirDetalleMovil() {
      if (window.innerWidth <= 820) {
        document.getElementById("detail-container").classList.add("mobile-open");
        document.body.classList.add("mobile-detail-active");
      }
    }

    function cerrarDetalleMovil() {
      document.getElementById("detail-container").classList.remove("mobile-open");
      document.body.classList.remove("mobile-detail-active");
    }

    function actualizarEstadoSync(texto, esOffline = false) {
      const pill = document.getElementById("statusPill");
      pill.textContent = texto;
      if (esOffline) {
        pill.classList.add("offline");
      } else {
        pill.classList.remove("offline");
      }
    }

    async function cargarDatos(forzarRed = false) {
      const container = document.getElementById("tree-container");

      if (!forzarRed) {
        const localData = localStorage.getItem(STORAGE_KEY);
        if (localData) {
          try {
            const json = JSON.parse(localData);
            rawUT = json.ubicaciones || [];
            rawEQ = json.equipos || [];
            actualizarEstadoSync("CACHÉ LOCAL", true);
            inicializarVista();
            return;
          } catch (e) {}
        }
      }

      container.innerHTML = '<div class="loader">Sincronizando datos desde Google Sheets...</div>';
      actualizarEstadoSync("SINCRONIZANDO...", true);

      try {
        const url = forzarRed ? `${API_URL}?refresh=1` : API_URL;
        const res = await fetch(url);
        const json = await res.json();
        rawUT = json.ubicaciones || [];
        rawEQ = json.equipos || [];

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(json));
        } catch (e) {}

        actualizarEstadoSync(`ONLINE · ${rawEQ.length} EQ`, false);
        inicializarVista();
      } catch (err) {
        actualizarEstadoSync("ERROR RED", true);
        container.innerHTML = `<div class="loader" style="color:#ff5b77;">Error al conectar con Google Sheets. Revisa la URL del script.<br><small>${err}</small></div>`;
      }
    }

    function inicializarVista() {
      treeData = construirArbol(rawUT, rawEQ);
      treeData.forEach(root => detectarEstacionNodo(root, ""));
      poblarFiltros();
      renderizarArbol();
    }

    function detectarEstacionNodo(nodo, ancestroEstacion = "") {
      const emp = (nodo.raw && nodo.raw["Emplazamiento"]) ? nodo.raw["Emplazamiento"].trim() : "";
      const estacionActual = ESTACIONES_MAPA[emp] || ancestroEstacion || "";

      nodo._estacion = estacionActual;

      if (nodo.children && nodo.children.length > 0) {
        nodo.children.forEach(hijo => detectarEstacionNodo(hijo, estacionActual));
      }
    }

    function poblarFiltros() {
      const troncales = new Set();
      const criticidades = new Set();

      [...rawUT, ...rawEQ].forEach(item => {
        if (item["Troncal"]) troncales.add(item["Troncal"]);
        if (item["Criticidad"]) criticidades.add(item["Criticidad"]);
      });

      const selEstacion = document.getElementById("filterEstacion");
      selEstacion.innerHTML = '<option value="">Todas las Estaciones</option>';
      Object.values(ESTACIONES_MAPA).forEach(label => {
        selEstacion.innerHTML += `<option value="${label}">${label}</option>`;
      });

      const selTroncal = document.getElementById("filterTroncal");
      selTroncal.innerHTML = '<option value="">Todas las Troncales</option>';
      [...troncales].sort().forEach(t => selTroncal.innerHTML += `<option value="${t}">${t}</option>`);

      const selCrit = document.getElementById("filterCriticidad");
      selCrit.innerHTML = '<option value="">Toda Criticidad</option>';
      [...criticidades].sort().forEach(c => selCrit.innerHTML += `<option value="${c}">Criticidad: ${c}</option>`);
    }

    function construirArbol(ubicaciones, equipos) {
      const mapUT = {};
      const mapEQ = {};
      const roots = [];

      ubicaciones.forEach(u => {
        const id = u["Ubicación técnica"];
        if (!id) return;
        const textoBusqueda = `${id} ${u["Denominación de la ubicación técnica"] || ""} ${Object.values(u).join(" ")}`.toLowerCase();
        mapUT[id] = {
          tipo: "UT",
          id: id,
          nombre: u["Denominación de la ubicación técnica"] || "Sin denominación",
          padreUT: u["Ubicación técnica superior"] || "",
          raw: u,
          _searchText: textoBusqueda,
          children: []
        };
      });

      equipos.forEach(e => {
        const id = e["Equipo"];
        if (!id) return;
        const textoBusqueda = `${id} ${e["Denominación de objeto técnico"] || ""} ${Object.values(e).join(" ")}`.toLowerCase();
        mapEQ[id] = {
          tipo: e["Equipo superior"] ? "SUBEQ" : "EQ",
          id: id,
          nombre: e["Denominación de objeto técnico"] || "Sin denominación",
          padreUT: e["Ubicación técnica"] || "",
          padreEQ: e["Equipo superior"] || "",
          raw: e,
          _searchText: textoBusqueda,
          children: []
        };
      });

      Object.values(mapUT).forEach(ut => {
        if (ut.padreUT && mapUT[ut.padreUT]) {
          mapUT[ut.padreUT].children.push(ut);
        } else {
          roots.push(ut);
        }
      });

      Object.values(mapEQ).forEach(eq => {
        if (eq.padreEQ && mapEQ[eq.padreEQ]) {
          mapEQ[eq.padreEQ].children.push(eq);
        } else if (eq.padreUT && mapUT[eq.padreUT]) {
          mapUT[eq.padreUT].children.push(eq);
        } else {
          roots.push(eq);
        }
      });

      return roots;
    }

    function renderizarArbol() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const utQuery = document.getElementById("searchUT").value.toLowerCase().trim();
      const estacion = document.getElementById("filterEstacion").value;
      const troncal = document.getElementById("filterTroncal").value;
      const crit = document.getElementById("filterCriticidad").value;

      const hayFiltro = query.length > 0 || utQuery.length > 0 || estacion !== "" || troncal !== "" || crit !== "";
      const arbolFiltrado = hayFiltro ? filtrarNodos(treeData, query, utQuery, estacion, troncal, crit) : treeData;

      const container = document.getElementById("tree-container");
      container.innerHTML = "";

      if (arbolFiltrado.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron activos con esos criterios.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      arbolFiltrado.forEach(root => {
        fragment.appendChild(crearElementoNodo(root, true, hayFiltro));
      });
      container.appendChild(fragment);
    }

    function filtrarNodos(nodos, query, utQuery, estacion, troncal, crit, ancestroCoincidio = false) {
      return nodos.map(nodo => {
        const utPropia = (nodo.tipo === "UT" ? nodo.id : (nodo.raw["Ubicación técnica"] || "")).toLowerCase();
        const denomUT = (nodo.raw["Denominación de la ubicación técnica"] || "").toLowerCase();

        const matchQuery = !query || nodo._searchText.includes(query);
        const matchUT = !utQuery || utPropia.includes(utQuery) || denomUT.includes(utQuery);
        const matchEstacion = !estacion || nodo._estacion === estacion;
        const matchTroncal = !troncal || nodo.raw["Troncal"] === troncal;
        const matchCrit = !crit || nodo.raw["Criticidad"] === crit;

        const esteNodoCoincide = matchQuery && matchUT && matchEstacion && matchTroncal && matchCrit;
        const mostrarHijosCompletos = ancestroCoincidio || ((Boolean(query) || Boolean(utQuery)) && esteNodoCoincide);

        const hijosFiltrados = mostrarHijosCompletos
          ? filtrarNodos(nodo.children, "", "", estacion, troncal, crit, true)
          : filtrarNodos(nodo.children, query, utQuery, estacion, troncal, crit, false);

        if (esteNodoCoincide || hijosFiltrados.length > 0) {
          return {
            ...nodo,
            children: hijosFiltrados,
            _expandirPorFiltro: !ancestroCoincidio && hijosFiltrados.length > 0
          };
        }
        return null;
      }).filter(Boolean);
    }

    function crearElementoNodo(nodo, isRoot, hayFiltro) {
      const div = document.createElement("div");
      div.className = isRoot ? "node node-root" : "node";

      const tieneHijos = nodo.children && nodo.children.length > 0;
      const abrirHijos = hayFiltro && (nodo._expandirPorFiltro !== false);

      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const badgeText = nodo.tipo === "UT" ? "UT" : (nodo.tipo === "EQ" ? "EQ" : "SUB");

      const row = document.createElement("div");
      row.className = "node-row";
      row.innerHTML = `
        <span class="toggle">${tieneHijos ? (abrirHijos ? "▼" : "▶") : "•"}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="code">${nodo.id}</span>
        <span class="desc" title="${nodo.nombre}">${nodo.nombre}</span>
      `;

      row.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll(".node-row.selected").forEach(el => el.classList.remove("selected"));
        row.classList.add("selected");
        mostrarDetalle(nodo);
        abrirDetalleMovil();

        if (tieneHijos) {
          const childrenDiv = div.querySelector(".children");
          const toggleSpan = row.querySelector(".toggle");
          const isOpen = childrenDiv.classList.toggle("open");
          toggleSpan.textContent = isOpen ? "▼" : "▶";
        }
      };

      div.appendChild(row);

      if (tieneHijos) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = abrirHijos ? "children open" : "children";
        nodo.children.forEach(hijo => {
          childrenContainer.appendChild(crearElementoNodo(hijo, false, hayFiltro));
        });
        div.appendChild(childrenContainer);
      }

      return div;
    }

    function mostrarDetalle(nodo) {
      const panel = document.getElementById("detail-content");
      const r = nodo.raw;
      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const tipoLabel = nodo.tipo === "UT" ? "Ubicación Técnica (IH06)" : (nodo.tipo === "EQ" ? "Equipo Principal (IH08)" : "Sub-equipo / Componente (IH08)");

      let specsHTML = "";
      Object.entries(r).forEach(([clave, valor]) => {
        if (valor && valor.trim() !== "") {
          specsHTML += `
            <div class="spec-card">
              <div class="spec-label">${clave}</div>
              <div class="spec-value">${valor}</div>
            </div>
          `;
        }
      });

      panel.innerHTML = `
        <div class="detail-header">
          <span class="badge ${badgeClass}">${tipoLabel}</span>
          <h2 class="detail-title">${nodo.nombre}</h2>
          <div class="detail-code">
            <span>${nodo.id}</span>
            <button class="hud-btn-cut" onclick="navigator.clipboard.writeText('${nodo.id}')" title="Copiar código">📋 Copiar</button>
          </div>
        </div>
        <div class="grid-specs">${specsHTML}</div>
        <div class="future-actions hud-frame">
          <button class="hud-btn-cut" onclick="alert('Aquí conectaremos el historial de inspecciones de ${nodo.id}')">🔍 Ver Inspecciones (Próximamente)</button>
          <button class="hud-btn-cut" onclick="alert('Aquí abriremos planos/documentos de ${nodo.id}')">📁 Documentos Asociados</button>
        </div>
      `;
    }

    function expandirTodo(abrir) {
      document.querySelectorAll(".children").forEach(el => {
        abrir ? el.classList.add("open") : el.classList.remove("open");
      });
      document.querySelectorAll(".node-row").forEach(row => {
        const toggle = row.querySelector(".toggle");
        if (toggle.textContent !== "•") toggle.textContent = abrir ? "▼" : "▶";
      });
    }

    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderizarArbol, 200);
    });
    document.getElementById("searchUT").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderizarArbol, 200);
    });
    document.getElementById("filterEstacion").addEventListener("change", renderizarArbol);
    document.getElementById("filterTroncal").addEventListener("change", renderizarArbol);
    document.getElementById("filterCriticidad").addEventListener("change", renderizarArbol);

    aplicarModoCampo(localStorage.getItem(FIELD_MODE_KEY) === "1");
    cargarDatos();
  </script>
</body>
</html>
